name: student_mobile
description: EduCore Student Mobile App
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  # Navigation
  go_router: ^13.0.0

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # HTTP
  dio: ^5.9.2
  qr_flutter: ^4.1.0

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0
  hive_flutter: ^1.1.0

  # UI
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  fl_chart: ^0.67.0

  # PDF
  syncfusion_flutter_pdfviewer: ^27.1.51

  # Utilities
  intl: ^0.19.0
  connectivity_plus: ^6.0.0
  url_launcher: ^6.3.2
  file_picker: ^11.0.2
  image_picker: ^1.0.7

  # Icons
  font_awesome_flutter: ^10.7.0

  # Notifications
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.1.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
  #   - .env
