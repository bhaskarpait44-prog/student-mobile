name: student_mobile
description: EduCore Student Mobile App
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  # Navigation
  go_router: ^13.0.0

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # HTTP
  dio: ^5.4.0

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0
  hive_flutter: ^1.1.0

  # UI
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  fl_chart: ^0.67.0

  # PDF
  syncfusion_flutter_pdfviewer: ^24.2.0

  # Utilities
  intl: ^0.19.0
  connectivity_plus: ^6.0.0
  url_launcher: ^6.2.0
  file_picker: ^8.0.0
  image_picker: ^1.0.7

  # Icons
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
  #   - .env
